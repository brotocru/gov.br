<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: none;
      background: #000;
      overflow: hidden;
    }

    .screen.active {
      display: block;
    }

    .background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* LOADING */

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .loading-content {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      z-index: 3;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spinner {
      width: 48px;
      height: 48px;

      border: 6px solid transparent;
      border-top-color: #1769d2;
      border-right-color: #1769d2;
      border-bottom-color: #1769d2;

      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: white;
      font-size: 21px;
      font-weight: 700;
      margin-top: 12px;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* BOTÕES INVISÍVEIS */

    .click-area {
      position: absolute;
      border: 0;
      outline: 0;
      background: transparent;
      z-index: 10;
      cursor: pointer;
    }

    /*
      TELA 2
      AJUSTE ESTES VALORES DEPOIS,
      se necessário.
    */
    #button-screen2 {
      left: 62%;
      top: 90%;
      width: 14%;
      height: 8%;
    }

    /*
      TELA 3
      AJUSTE ESTES VALORES DEPOIS,
      se necessário.
    */
    #button-screen3 {
      left: 10%;
      top: 60%;
      width: 80%;
      height: 15%;
    }

    /* CARROSSEL FINAL */

    .slider {
      width: 100%;
      height: 100%;

      display: flex;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;

      scrollbar-width: none;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .slide {
      position: relative;

      flex: 0 0 100%;
      width: 100%;
      height: 100%;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    .slide img {
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    /* BOLINHAS DO CARROSSEL */

    .dots {
      position: absolute;

      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      gap: 8px;

      z-index: 20;

      padding: 7px 10px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.25);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.45);

      transition: 0.2s;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
    }
  </style>
</head>

<body>

  <!-- TELA 1 - LOADING -->

  <div id="screen1" class="screen active">
    <img
      src="loading.jpg"
      class="background-image"
      alt=""
    >

    <div class="loading-overlay"></div>

    <div class="loading-content">
      <div class="spinner"></div>

      <div class="loading-text">
        Aguarde...
      </div>
    </div>
  </div>


  <!-- TELA 2 -->

  <div id="screen2" class="screen">
    <img
      src="tela2.jpg"
      class="background-image"
      alt=""
    >

    <button
      id="button-screen2"
      class="click-area"
      onclick="goToScreen(3)"
      aria-label="Continuar"
    ></button>
  </div>


  <!-- TELA 3 -->

  <div id="screen3" class="screen">
    <img
      src="tela3.jpg"
      class="background-image"
      alt=""
    >

    <button
      id="button-screen3"
      class="click-area"
      onclick="goToScreen(4)"
      aria-label="Continuar"
    ></button>
  </div>


  <!-- TELA 4 - CARROSSEL -->

  <div id="screen4" class="screen">

    <div id="slider" class="slider">

      <div class="slide">
        <img src="final1.jpg" alt="">
      </div>

      <div class="slide">
        <img src="final2.jpg" alt="">
      </div>

      <div class="slide">
        <img src="final3.jpg" alt="">
      </div>

      <div class="slide">
        <img src="final4.jpg" alt="">
      </div>

    </div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>


  <script>
    /*
      APÓS 3 SEGUNDOS,
      SAI DO LOADING
    */

    setTimeout(function () {
      goToScreen(2);
    }, 6000);


    /*
      TROCA DE TELA
    */

    function goToScreen(number) {
      const screens =
        document.querySelectorAll(".screen");

      screens.forEach(function (screen) {
        screen.classList.remove("active");
      });

      const next =
        document.getElementById("screen" + number);

      next.classList.add("active");

      if (number === 4) {
        const slider =
          document.getElementById("slider");

        slider.scrollLeft = 0;

        updateDots(0);
      }
    }


    /*
      CARROSSEL
    */

    const slider =
      document.getElementById("slider");

    const dots =
      document.querySelectorAll(".dot");


    slider.addEventListener("scroll", function () {
      const slideWidth =
        slider.clientWidth;

      const currentSlide =
        Math.round(
          slider.scrollLeft / slideWidth
        );

      updateDots(currentSlide);
    });


    function updateDots(index) {
      dots.forEach(function (dot) {
        dot.classList.remove("active");
      });

      if (dots[index]) {
        dots[index].classList.add("active");
      }
    }
  </script>

</body>
</html>
